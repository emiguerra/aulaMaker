<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="contenido" transform="translate(0 -10)"><g id="encabezados"><text x="330.77" y="192" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Antes</text><text x="297.41" y="206.5" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Idea inicial</text><text x="315.26" y="226" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Seminario</text><text x="436" y="192" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Después</text><text x="436" y="206.5" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Proyecto de título</text><text x="436" y="226" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Sala Maker</text></g><g id="par-1"><text x="131.93" y="262" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Un kit maker para acercar la fabricación digital al</text><text x="336.99" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">aula</text><text x="436" y="262" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Un taller de tres sesiones dentro de la sala</text><line x1="366" y1="271" x2="420" y2="271" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M426,271 L420.52,273.45 L420.52,268.55 Z" fill="#1E1E1E"/></g><g id="par-2"><text x="270.61" y="318" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Entregar un objeto</text><text x="436" y="318" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Construir una experiencia</text><line x1="366" y1="320.5" x2="420" y2="320.5" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M426,320.5 L420.52,322.95 L420.52,318.05 Z" fill="#1E1E1E"/></g><g id="par-3"><text x="304" y="361" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Protoboard</text><text x="436" y="361" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Placa