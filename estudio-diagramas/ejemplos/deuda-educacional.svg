<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="612" viewBox="0 0 1584 612"><g id="eje"><line x1="80" y1="312" x2="1504" y2="312" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M1504,312 L1498.52,314.45 L1498.52,309.55 Z" fill="#1E1E1E"/></g><g id="hito-1"><circle cx="246.4" cy="312" r="3.2" fill="#FF4040"/><path d="M246.4,306 L246.4,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="213.39" y="230.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">1973–1990</text><text x="169.12" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Municipalización y financiamiento</text><text x="205.85" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">estatal a privados</text><text x="221.41" y="276.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Bellei (2015)</text></g><g id="hito-2"><circle cx="519.2" cy="312" r="3.2" fill="#FF4040"/><path d="M519.2,318 L519.2,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="503.47" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2006</text><text x="435.06" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Segmentación social: los quintiles de</text><text x="447.08" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">menor ingreso se desplazan a la</text><text x="472.43" y="388" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">educación municipal</text><text x="487.95" y="405" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Cornejo (2006)</text></g><g id="hito-3"><circle cx="822" cy="312" r="3.2" fill="#FF4040"/><path d="M822,306 L822,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="870.48" y="230.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2018</text><text x="804" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Cerca del 80 % de los liceos agrupa</text><text x="832.15" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">por habilidad al ingreso</text><text x="844.78" y="276.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Treviño et al. (2018)</text></g><g id="hito-4"><circle cx="1064.8" cy="312" r="3.2" fill="#FF4040"/><path d="M1064.8,318 L1064.8,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="1049.42" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2023</text><text x="987.09" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">En Matemática 4° básico, el grupo</text><text x="985.75" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">alto promedia 292 puntos y el bajo</text><text x="1056.61" y="388" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">237</text><text x="1010.38" y="405" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Agencia de Calidad (2024)</text></g><g id="hito-5"><circle cx="1337.6" cy="312" r="3.2" fill="#FF4040"/><path d="M1337.6,306 L1337.6,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="1302.44" y="217.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2015–2024</text><text x="1254.52" y="233.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La segregación baja un 35 %, pero el</text><text x="1255.59" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">financiamiento compartido sigue en</text><text x="1286.13" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">el 20 % de la matrícula</text><text x="1289.59" y="276.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Valenzuela et al. (2025)</text></g></svg>