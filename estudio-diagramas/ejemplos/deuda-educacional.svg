<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="eje"><line x1="40" y1="312" x2="752" y2="312" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M752,312 L746.52,314.45 L746.52,309.55 Z" fill="#1E1E1E"/></g><g id="hito-1"><circle cx="135.2" cy="312" r="3.2" fill="#FF4040"/><path d="M135.2,306 L135.2,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="102.19" y="230.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">1973–1990</text><text x="57.92" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Municipalización y financiamiento</text><text x="94.65" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">estatal a privados</text><text x="110.21" y="276.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Bellei (2015)</text></g><g id="hito-2"><circle cx="265.6" cy="312" r="3.2" fill="#FF4040"/><path d="M265.6,318 L265.6,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="249.87" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2006</text><text x="181.46" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Segmentación social: los quintiles de</text><text x="193.48" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">menor ingreso se desplazan a la</text><text x="218.83" y="388" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">educación municipal</text><text x="234.35" y="405" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Cornejo (2006)</text></g><g id="hito-3"><circle cx="396" cy="312" r="3.2" fill="#FF4040"/><path d="M396,306 L396,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="381.41" y="230.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2018</text><text x="314.93" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Cerca del 80 % de los liceos agrupa</text><text x="343.08" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">por habilidad al ingreso</text><text x="355.71" y="276.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Treviño et al. (2018)</text></g><g id="hito-4"><circle cx="526.4" cy="312" r="3.2" fill="#FF4040"/><path d="M526.4,318 L526.4,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="511.02" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2023</text><text x="448.69" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">En Matemática 4° básico, el grupo</text><text x="447.35" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">alto promedia 292 puntos y el bajo</text><text x="518.21" y="388" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">237</text><text x="471.98" y="405" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Agencia de Calidad (2024)</text></g><g id="hito-5"><circle cx="656.8" cy="312" r="3.2" fill="#FF4040"/><path d="M656.8,306 L656.8,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="621.64" y="217.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">2015–2024</text><text x="573.72" y="233.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La segregación baja un 35 %, pero el</text><text x="574.79" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">financiamiento compartido sigue en</text><text x="605.33" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">el 20 % de la matrícula</text><text x="608.79" y="276.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Valenzuela et al. (2025)</text></g></svg>
