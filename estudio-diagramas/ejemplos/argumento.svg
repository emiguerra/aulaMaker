<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="cadena"><line x1="135.2" y1="252.75" x2="251.6" y2="252.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M252.6,252.75 L247.12,255.2 L247.12,250.3 Z" fill="#1E1E1E"/><line x1="269.6" y1="252.75" x2="386" y2="252.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M387,252.75 L381.52,255.2 L381.52,250.3 Z" fill="#1E1E1E"/><line x1="404" y1="252.75" x2="520.4" y2="252.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M521.4,252.75 L515.92,255.2 L515.92,250.3 Z" fill="#1E1E1E"/><line x1="538.4" y1="252.75" x2="654.8" y2="252.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M655.8,252.75 L650.32,255.2 L650.32,250.3 Z" fill="#1E1E1E"/></g><g id="eslabon-1"><circle cx="127.2" cy="252.75" r="3.6" fill="#FF4040"/><text x="123.2" y="230.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Problemática</text><line x1="127.2" y1="259.75" x2="127.2" y2="286.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="123.2" y="302.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Los métodos</text><text x="123.2" y="315.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">memorísticos no</text><text x="123.2" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">cierran la brecha de</text><text x="123.2" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">resultados entre</text><text x="123.2" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">grupos</text><text x="123.2" y="367.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">socioeconómicos: la</text><text x="123.2" y="380.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">mantienen.</text></g><g id="eslabon-2"><circle cx="261.6" cy="252.75" r="3.6" fill="#FF4040"/><text x="257.6" y="230.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Oportunidad</text><line x1="261.6" y1="259.75" x2="261.6" y2="286.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="257.6" y="302.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La cultura DIY permite</text><text x="257.6" y="315.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">aprender haciendo sin</text><text x="257.6" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">necesitar un Fab Lab.</text></g><g id="eslabon-3"><circle cx="396" cy="252.75" r="3.6" fill="#FF4040"/><text x="392" y="230.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Justificación</text><line x1="396" y1="259.75" x2="396" y2="286.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="392" y="302.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La fabricación digital</text><text x="392" y="315.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">obliga a decidir,</text><text x="392" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">anticipar errores,</text><text x="392" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">ajustar y volver a</text><text x="392" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">intentar.</text></g><g id="eslabon-4"><circle cx="530.4" cy="252.75" r="3.6" fill="#FF4040"/><text x="526.4" y="230.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Hipótesis</text><line x1="530.4" y1="259.75" x2="530.4" y2="286.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="526.4" y="302.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Un recurso pedagógico</text><text x="526.4" y="315.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">maker contribuye a las</text><text x="526.4" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">metodologías de</text><text x="526.4" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">enseñanza sin</text><text x="526.4" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">infraestructura</text><text x="526.4" y="367.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">especializada.</text></g><g id="eslabon-5"><circle cx="664.8" cy="252.75" r="3.6" fill="#FF4040"/><text x="660.8" y="230.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Pregunta</text><line x1="664.8" y1="259.75" x2="664.8" y2="286.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="660.8" y="302.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">¿Puede el diseño de un</text><text x="660.8" y="315.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">recurso pedagógico</text><text x="660.8" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">maker integrar</text><text x="660.8" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">metodologías activas</text><text x="660.8" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">en el aula municipal?</text></g></svg>
