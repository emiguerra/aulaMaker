<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="612" viewBox="0 0 1584 612"><g id="cadena"><line x1="254.4" y1="278.75" x2="509.2" y2="278.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M510.2,278.75 L504.72,281.2 L504.72,276.3 Z" fill="#1E1E1E"/><line x1="527.2" y1="278.75" x2="812" y2="278.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M813,278.75 L807.52,281.2 L807.52,276.3 Z" fill="#1E1E1E"/><line x1="830" y1="278.75" x2="1054.8" y2="278.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M1055.8,278.75 L1050.32,281.2 L1050.32,276.3 Z" fill="#1E1E1E"/><line x1="1072.8" y1="278.75" x2="1327.6" y2="278.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M1328.6,278.75 L1323.12,281.2 L1323.12,276.3 Z" fill="#1E1E1E"/></g><g id="eslabon-1"><circle cx="246.4" cy="278.75" r="3.6" fill="#FF4040"/><text x="242.4" y="256.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Problemática</text><line x1="246.4" y1="285.75" x2="246.4" y2="312.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="242.4" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Los métodos memorísticos no cierran la</text><text x="242.4" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">brecha de resultados entre grupos</text><text x="242.4" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">socioeconómicos: la mantienen.</text></g><g id="eslabon-2"><circle cx="519.2" cy="278.75" r="3.6" fill="#FF4040"/><text x="515.2" y="256.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Oportunidad</text><line x1="519.2" y1="285.75" x2="519.2" y2="312.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="515.2" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La cultura DIY permite aprender haciendo sin</text><text x="515.2" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">necesitar un Fab Lab.</text></g><g id="eslabon-3"><circle cx="822" cy="278.75" r="3.6" fill="#FF4040"/><text x="818" y="256.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Justificación</text><line x1="822" y1="285.75" x2="822" y2="312.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="818" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La fabricación digital obliga a decidir,</text><text x="818" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">anticipar errores, ajustar y volver a intentar.</text></g><g id="eslabon-4"><circle cx="1064.8" cy="278.75" r="3.6" fill="#FF4040"/><text x="1060.8" y="256.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Hipótesis</text><line x1="1064.8" y1="285.75" x2="1064.8" y2="312.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="1060.8" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Un recurso pedagógico maker contribuye a</text><text x="1060.8" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">las metodologías de enseñanza sin</text><text x="1060.8" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">infraestructura especializada.</text></g><g id="eslabon-5"><circle cx="1337.6" cy="278.75" r="3.6" fill="#FF4040"/><text x="1333.6" y="256.75" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Pregunta</text><line x1="1337.6" y1="285.75" x2="1337.6" y2="312.75" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="1333.6" y="328.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">¿Puede el diseño de un recurso pedagógico</text><text x="1333.6" y="341.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">maker integrar metodologías activas en el</text><text x="1333.6" y="354.75" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">aula municipal?</text></g></svg>