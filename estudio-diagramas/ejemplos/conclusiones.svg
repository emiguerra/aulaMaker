<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="columna-1"><text x="298.24" y="223" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF4040">Limitaciones</text><circle cx="78" cy="263.6" r="1.4" fill="#1E1E1E"/><text x="90" y="267" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Un solo curso:</text><text x="157.13" y="267" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">una experiencia acotada a tres sesiones.</text><circle cx="78" cy="286.6" r="1.4" fill="#1E1E1E"/><text x="90" y="290" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Depende de alguien externo que prepare los recursos y</text><text x="90" y="303" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">guíe a los estudiantes.</text><circle cx="78" cy="322.6" r="1.4" fill="#1E1E1E"/><text x="90" y="326" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La escuela por sí sola no cuenta con las herramientas.</text></g><g id="columna-2"><text x="424" y="223" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF4040">Proyecciones</text><path d="M427,258.9 L427,268.1 M430.98,261.2 L423.02,265.8 M430.98,265.8 L423.02,261.2" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="438" y="267" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Otros cursos y establecimientos:</text><text x="592.07" y="267" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">ajustar contenidos a</text><text x="438" y="280" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">distintos niveles.</text><path d="M427,294.9 L427,304.1 M430.98,297.2 L423.02,301.8 M430.98,301.8 L423.02,297.2" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="438" y="303" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Docentes que guían las sesiones.</text><path d="M427,317.9 L427,327.1 M430.98,320.2 L423.02,324.8 M430.98,324.8 L423.02,320.2" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="438" y="326" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Un ciclo más largo, con más trabajo en grupo.</text><path d="M427,340.9 L427,350.1 M430.98,343.2 L423.02,347.8 M430.98,347.8 L423.02,343.2" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="438" y="349" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Vínculo con laboratorios, universidades o Red NodoLab.</text><path d="M427,363.9 L427,373.1 M430.98,366.2 L423.02,370.8 M430.98,370.8 L423.02,366.2" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="438" y="372" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Financiamiento con la Subvención Escolar Preferencial.</text></g><g id="t"><line x1="70" y1="237" x2="722" y2="237" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="396" y1="237" x2="396" y2="395" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g></svg>