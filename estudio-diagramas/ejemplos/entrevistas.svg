l="#6F6F6E">Pendiente: la entrevista aún no está en la memoria</text><line x1="974" y1="188" x2="974" y2="212" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><circle cx="974" cy="212" r="2.3" fill="#1E1E1E"/><text x="990" y="215.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Completar con sus hallazgos</text><line x1="974" y1="216" x2="974" y2="383" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="974" cy="383" r="2.3" fill="#1E1E1E"/></g><g id="destino"><line x1="143.5" y1="383" x2="1337" y2="383" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M1337,383 L1331.52,385.45 L1331.52,380.55 Z" fill="#1E1E1E"/><rect x="1340" y="327" width="164" height="112" rx="22" ry="22" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="1422" cy="327" r="7.5" fill="#3CBF96"/><text x="1392.99" y="370.47" font-family="NeutrifStudio-SemiBold" font-size="11.5" fill="#1E1E1E">Sala Maker</text><text x="1362.74" y="389.47" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Taller de tres sesiones en la</text><text x="1392.1" y="401.47" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">sala de clases</text></g><g id="leyenda"><path d="M1346,456.1 L1346,466.9 M1350.68,458.8 L1341.32,464.2 M1350.68,464.2 L1341.32,458.8" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="1358" y="465" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Factor que rescata el proyecto</text><circle cx="1346" cy="478" r="2.3" fill="#1E1E1E"/><text x="1358" y="481.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Factor del referente</text></g></svg>