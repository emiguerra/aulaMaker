linecap="round"/><text x="85.33" y="356" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Faltan perfeccionamiento</text><text x="85.33" y="369.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">docente y recursos</text><line x1="69.33" y1="361.5" x2="69.33" y2="408.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="69.33" cy="408.5" r="2.3" fill="#1E1E1E"/></g><g id="referente-2"><text x="234" y="115.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Entrevista 02</text><text x="234" y="131" font-family="NeutrifStudio-Medium" font-size="13" fill="#2E90CF">Patricia Ramírez</text><text x="234" y="144.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Cofundadora de IdeoMaker</text><line x1="242" y1="162.5" x2="242" y2="280.5" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M242,181.1 L242,191.9 M246.68,183.8 L237.32,189.2 M246.68,189.2 L237.32,183.8" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="258" y="190" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Un docente interesado</text><text x="258" y="203.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">gestiona todo</text><path d="M242,228.1 L242,238.9 M246.68,230.8 L237.32,236.2 M246.68,236.2 L237.32,230.8" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="258" y="237" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Diseño a la carta según</text><text x="258" y="250.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">edad, nivel y temática</text><circle cx="242" cy="280.5" r="2.3" fill="#1E1E1E"/><text x="258" y="284" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Medir resultados con</text><text x="258" y="297.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">niños es un punto débil</text><line x1="242" y1="284.5" x2="242" y2="408.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="242" cy="408.5" r="2.3" fill="#1E1E1E"/></g><g id="referente-3"><text x="406.67" y="115.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Entrevista 03</text><text x="406.67" y="131" font-family="NeutrifStudio-Medium" font-size="13" fill="#2E90CF">Karen</text><text x="406.67" y="144.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Pendiente: la entrevista aún no está</text><text x="406.67" y="156" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">en la memoria</text><line x1="414.67" y1="174" x2="414.67" y2="198" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><circle cx="414.67" cy="198" r="2.3" fill="#1E1E1E"/><text x="430.67" y="201.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Completar con sus</text><text x="430.67" y="215" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">hallazgos</text><line x1="414.67" y1="202" x2="414.67" y2="408.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="414.67" cy="408.5" r="2.3" fill="#1E1E1E"/></g><g id="destino"><line x1="69.33" y1="408.5" x2="575" y2="408.5" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M575,408.5 L569.52,410.95 L569.52,406.05 Z" fill="#1E1E1E"/><rect x="578" y="352.5" width="164" height="112" rx="22" ry="22" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="660" cy="352.5" r="7.5" fill="#3CBF96"/><text x="630.99" y="395.97" font-family="NeutrifStudio-SemiBold" font-size="11.5" fill="#1E1E1E">Sala Maker</text><text x="600.74" y="414.97" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Taller de tres sesiones en la</text><text x="630.1" y="426.97" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">sala de clases</text></g><g id="leyenda"><path d="M584,481.6 L584,492.4 M588.68,484.