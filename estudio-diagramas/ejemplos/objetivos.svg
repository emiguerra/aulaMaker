<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="612" viewBox="0 0 1584 612"><g id="contenido" transform="translate(0 120)"><g id="raiz"><text x="349.78" y="70" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF4040">Objetivo general</text><text x="136.93" y="92" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Implementar un recurso pedagógico maker que proponga metodologías activas de aprendizaje, mediante un taller</text><text x="288.92" y="105" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">de tres sesiones en un quinto básico municipal.</text><line x1="396" y1="132" x2="396" y2="162" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g><g id="ramas"><line x1="273" y1="162" x2="1311" y2="162" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="273" y1="162" x2="273" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="599" y1="162" x2="599" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="985" y1="162" x2="985" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="1311" y1="162" x2="1311" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g><g id="hijo-1"><circle cx="273" cy="190" r="3" fill="#1E1E1E"/><text x="244.28" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 01</text><text x="251.25" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Analizar</text><text x="163.46" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Las metodologías de enseñanza de la educación</text><text x="163.5" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">básica municipal, para definir criterios del taller.</text><line x1="273" y1="274.5" x2="273" y2="294.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M218.57,300.5 L218.57,310.5 M222.9,303 L214.24,308 M222.9,308 L214.24,303" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="229.57" y="309" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 01 · Investigación</text></g><g id="hijo-2"><circle cx="599" cy="190" r="3" fill="#1E1E1E"/><text x="569.47" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 02</text><text x="580.58" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Definir</text><text x="484.95" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Los recursos pedagógicos y de fabricación digital,</text><text x="498.91" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">en una secuencia de sesiones con narrativa.</text><line x1="599" y1="274.5" x2="599" y2="294.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M504.88,300.5 L504.88,310.5 M509.22,303 L500.55,308 M509.22,308 L500.55,303" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="515.88" y="309" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapas 03 y 05 · Planificación y desarrollo</text></g><g id="hijo-3"><circle cx="985" cy="190" r="3" fill="#1E1E1E"/><text x="955.4" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 03</text><text x="950.45" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Implementar</text><text x="887.69" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">El taller en un quinto básico, como primera</text><text x="899.48" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">experiencia con la fabricación digital.</text><line x1="985" y1="274.5" x2="985" y2="294.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M923.51,300.5 L923.51,310.5 M927.84,303 L919.18,308 M927.84,308 L919.18,303" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="934.51" y="309" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 06 · Implementación</text></g><g id="hijo-4"><circle cx="1311" cy="190" r="3" fill="#1E1E1E"/><text x="1281.11" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 04</text><text x="1259.44" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Identificar mejoras</text><text x="1198.75" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">A partir de lo observado y de la conversación con</text><text x="1233.6" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">docentes, para proyectar el taller.</text><line x1="1311" y1="274.5" x2="1311" y2="294.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M1239.53,300.5 L1239.53,310.5 M1243.86,303 L1235.2,308 M1243.86,308 L1235.2,303" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="1250.53" y="309" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 07 · Análisis y proyección</text></g></g></svg>