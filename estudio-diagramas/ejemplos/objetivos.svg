<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="contenido" transform="translate(0 101)"><g id="raiz"><text x="349.78" y="70" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF4040">Objetivo general</text><text x="136.93" y="92" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Implementar un recurso pedagógico maker que proponga metodologías activas de aprendizaje, mediante un taller</text><text x="288.92" y="105" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">de tres sesiones en un quinto básico municipal.</text><line x1="396" y1="132" x2="396" y2="162" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g><g id="ramas"><line x1="141" y1="162" x2="651" y2="162" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="141" y1="162" x2="141" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="311" y1="162" x2="311" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="481" y1="162" x2="481" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="651" y1="162" x2="651" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g><g id="hijo-1"><circle cx="141" cy="190" r="3" fill="#1E1E1E"/><text x="112.28" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 01</text><text x="119.25" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Analizar</text><text x="68.71" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Las metodologías de enseñanza</text><text x="89.08" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">de la educación básica</text><text x="69.97" y="272.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">municipal, para definir criterios</text><text x="119.76" y="285.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">del taller.</text><line x1="141" y1="300.5" x2="141" y2="320.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M86.57,326.5 L86.57,336.5 M90.9,329 L82.24,334 M90.9,334 L82.24,329" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="97.57" y="335" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 01 · Investigación</text></g><g id="hijo-2"><circle cx="311" cy="190" r="3" fill="#1E1E1E"/><text x="281.47" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 02</text><text x="292.58" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Definir</text><text x="241.18" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Los recursos pedagógicos y de</text><text x="251.52" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">fabricación digital, en una</text><text x="250.47" y="272.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">secuencia de sesiones con</text><text x="289.25" y="285.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">narrativa.</text><line x1="311" y1="300.5" x2="311" y2="320.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M243.33,326.5 L243.33,336.5 M247.66,329 L239,334 M247.66,334 L239,329" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="254.33" y="335" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapas 03 y 05 · Planificación</text><text x="254.33" y="347" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">y desarrollo</text></g><g id="hijo-3"><circle cx="481" cy="190" r="3" fill="#1E1E1E"/><text x="451.4" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 03</text><text x="446.45" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Implementar</text><text x="416.41" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">El taller en un quinto básico,</text><text x="412.26" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">como primera experiencia con</text><text x="432.79" y="272.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la fabricación digital.</text><line x1="481" y1="287.5" x2="481" y2="307.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M419.51,313.5 L419.51,323.5 M423.84,316 L415.18,321 M423.84,321 L415.18,316" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="430.51" y="322" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 06 · Implementación</text></g><g id="hijo-4"><circle cx="651" cy="190" r="3" fill="#1E1E1E"/><text x="621.11" y="212" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Específico 04</text><text x="599.44" y="226" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Identificar mejoras</text><text x="580.1" y="246.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">A partir de lo observado y de la</text><text x="586.8" y="259.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">conversación con docentes,</text><text x="597.73" y="272.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">para proyectar el taller.</text><line x1="651" y1="287.5" x2="651" y2="307.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M604.78,313.5 L604.78,323.5 M609.11,316 L600.45,321 M609.11,321 L600.45,316" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="615.78" y="322" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 07 · Análisis y</text><text x="615.78" y="334" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">proyección</text></g></g></svg>
