<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="contenido" transform="translate(0 7)"><g id="titulo"><text x="290.89" y="222" font-family="NeutrifStudio-SemiBold" font-size="11.5" fill="#1E1E1E">El diseño aporta desde dos dimensiones</text></g><g id="columna-1"><text x="226.96" y="258" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF4040">Mediador de experiencias</text><circle cx="78" cy="298.6" r="1.4" fill="#1E1E1E"/><text x="90" y="302" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Taller:</text><text x="120.36" y="302" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">organiza las sesiones, los materiales y el tiempo.</text><circle cx="78" cy="321.6" r="1.4" fill="#1E1E1E"/><text x="90" y="325" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Narrativa:</text><text x="138.45" y="325" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la historia de Michi da continuidad al proceso.</text><circle cx="78" cy="344.6" r="1.4" fill="#1E1E1E"/><text x="90" y="348" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">De escuchar a proponer:</text><text x="204.96" y="348" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">los estudiantes identifican</text><text x="90" y="361" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">problemas de su sala.</text></g><g id="columna-2"><text x="424" y="258" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF4040">Mundo objetual</text><circle cx="426" cy="298.6" r="1.4" fill="#1E1E1E"/><text x="438" y="302" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Implementos fabricados para la sala.</text><circle cx="426" cy="321.6" r="1.4" fill="#1E1E1E"/><text x="438" y="325" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Proyectos con Arduino como resultado tangible.</text><circle cx="426" cy="344.6" r="1.4" fill="#1E1E1E"/><text x="438" y="348" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Quedan en la sala:</text><text x="524.53" y="348" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">el docente los sigue usando en sus</text><text x="438" y="361" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">clases.</text></g><g id="t"><line x1="70" y1="272" x2="722" y2="272" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="396" y1="272" x2="396" y2="384" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g></g></svg>