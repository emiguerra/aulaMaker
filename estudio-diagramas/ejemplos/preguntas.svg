<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="contenido" transform="translate(0 15)"><g id="rejilla"><line x1="396" y1="153.3" x2="396" y2="257.9" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="60" y1="263.9" x2="732" y2="263.9" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="396" y1="269.9" x2="396" y2="368.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="60" y1="374.5" x2="732" y2="374.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/></g><g id="bloque-1-1"><text x="80" y="179.3" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">¿Qué?</text><text x="80" y="205.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Taller maker de tres sesiones para educación básica municipal,</text><text x="80" y="218.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">que usa la sala de clases como espacio de aprendizaje y</text><text x="80" y="231.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">desarrolla proyectos con Arduino.</text></g><g id="bloque-1-2"><text x="416" y="179.3" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">¿Por qué?</text><text x="416" y="205.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Porque la educación básica municipal sigue enseñando desde la</text><text x="416" y="218.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">transmisión; la fabricación digital puede entrar a la sala como</text><text x="416" y="231.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">recurso pedagógico.</text></g><g id="bloque-2-1"><text x="80" y="289.9" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">¿Cómo?</text><text x="80" y="315.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Tres sesiones con una semana entre cada una, unidas por la</text><text x="80" y="329.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">historia de un gatito perdido. El trabajo escala de lo individual a</text><text x="80" y="342.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">duplas y a grupos.</text></g><g id="bloque-2-2"><text x="416" y="289.9" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">¿Para qué?</text><text x="416" y="315.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Para que los estudiantes aprendan haciendo, la fabricación</text><text x="416" y="329.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">digital deje de ser lejana y se fortalezca el sentido de</text><text x="416" y="342.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">pertenencia con su sala.</text></g><g id="bloque-3-1"><text x="80" y="400.5" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">¿Cuándo y dónde?</text><text x="80" y="426.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Sala del 5° A del Colegio Maipo, Puente Alto, en horario de clases, entre octubre y noviembre de 2026.</text></g></g></svg>
