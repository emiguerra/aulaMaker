<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="612" viewBox="0 0 1584 612"><g id="referente-1"><text x="135.5" y="135.25" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Referente 01</text><text x="135.5" y="150.75" font-family="NeutrifStudio-Medium" font-size="13" fill="#2E90CF">Mi Primer Robot</text><text x="135.5" y="164.25" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Municipalidad de Renca, INNOVA UTEM y La Fábrica de</text><text x="135.5" y="175.75" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Renca</text><line x1="143.5" y1="193.75" x2="143.5" y2="332.75" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M143.5,212.35 L143.5,223.15 M148.18,215.05 L138.82,220.45 M148.18,220.45 L138.82,215.05" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="159.5" y="221.25" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Cada estudiante arma su robot desde cero</text><path d="M143.5,246.35 L143.5,257.15 M148.18,249.05 L138.82,254.45 M148.18,254.45 L138.82,249.05" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="159.5" y="255.25" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Electrónica y programación de forma</text><text x="159.5" y="268.75" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">lúdica</text><path d="M143.5,293.35 L143.5,304.15 M148.18,296.05 L138.82,301.45 M148.18,301.45 L138.82,296.05" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="159.5" y="302.25" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Jóvenes guían el taller</text><circle cx="143.5" cy="332.75" r="2.3" fill="#1E1E1E"/><text x="159.5" y="336.25" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Escala comunal: 1.300 estudiantes de 35</text><text x="159.5" y="349.75" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1