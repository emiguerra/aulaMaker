1E1E">Escala comunal: 1.300</text><text x="85.33" y="363" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">estudiantes de 35</text><text x="85.33" y="376.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">colegios</text><line x1="69.33" y1="350" x2="69.33" y2="402" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><circle cx="69.33" cy="402" r="2.3" fill="#1E1E1E"/></g><g id="referente-2"><text x="234" y="122" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Referente 02</text><text x="234" y="137.5" font-family="NeutrifStudio-Medium" font-size="13" fill="#2E90CF">Nube Lab</text><text x="234" y="151" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">Organización sin fines de lucro,</text><text x="234" y="162.5" font-family="NeutrifStudio-Regular" font-size="9" fill="#6F6F6E">desde 2012</text><line x1="242" y1="180.5" x2="242" y2="312" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M242,199.1 L242,209.9 M246.68,201.8 L237.32,207.2 M246.68,207.2 L237.32,201.8" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="258" y="208" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Materiales cotidianos, sin</text><text x="258" y="221.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">equipamiento</text><text x="258" y="235" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">especializado</text><path d="M242,259.6 L242,270.4 M246.68,262.3 L237.32,267.7 M246.68,267.7 L237.32,262.3" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="258" y="268.5" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">Actividades que el</text><text x="258" y="282" font-family="NeutrifStudio-Regular" font-size="10.5" fill="#1E1E1E">docente puede repetir</text><circle cx="242" cy="312" r="2.3" fill="#1E1E1E"/><text x="258" y="315.5" font-family="NeutrifStudio-Regula