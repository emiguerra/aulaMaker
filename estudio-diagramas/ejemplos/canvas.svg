<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="rejilla"><line x1="182.4" y1="105.2" x2="182.4" y2="390.2" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="324.8" y1="105.2" x2="324.8" y2="390.2" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="467.2" y1="105.2" x2="467.2" y2="390.2" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="609.6" y1="105.2" x2="609.6" y2="390.2" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="40" y1="396.2" x2="752" y2="396.2" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="467.2" y1="402.2" x2="467.2" y2="506.8" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/></g><g id="bloque-1-1"><text x="60" y="131.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Socios clave</text><text x="60" y="157.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Colegio Maipo,</text><text x="60" y="170.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Mechatronic</text><text x="60" y="183.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">(proveedor de</text><text x="60" y="196.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">electrónica), Fab Labs</text><text x="60" y="210" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">y laboratorios</text><text x="60" y="223.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">universitarios,</text><text x="60" y="236.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Universidad Diego</text><text x="60" y="249.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Portales.</text></g><g id="bloque-1-2"><text x="202.4" y="131.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Actividades y</text><text x="202.4" y="146.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">recursos clave</text><circle cx="204.4" cy="168.8" r="1.3" fill="#1E1E1E"/><text x="214.4" y="172.2" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Actividades:</text><text x="274.21" y="172.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">diseño</text><text x="214.4" y="185.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">del taller, modelado</text><text x="214.4" y="198.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">y fabricación</text><text x="214.4" y="211.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">digital, diseño de la</text><text x="214.4" y="225" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">placa PCB,</text><text x="214.4" y="238.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">facilitación, testeo</text><text x="214.4" y="251.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">e iteración.</text><circle cx="204.4" cy="268.2" r="1.3" fill="#1E1E1E"/><text x="214.4" y="271.6" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Recursos:</text><text x="261.78" y="271.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">diseño y</text><text x="214.4" y="284.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">fabricación digital,</text><text x="214.4" y="298" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">software,</text><text x="214.4" y="311.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">impresora 3D,</text><text x="214.4" y="324.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">cortadora láser,</text><text x="214.4" y="337.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">kits con Arduino y</text><text x="214.4" y="350.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la narrativa de</text><text x="214.4" y="364" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Michi.</text></g><g id="bloque-1-3"><text x="344.8" y="131.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Propuesta de</text><text x="344.8" y="146.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">valor</text><text x="344.8" y="172.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Taller maker de tres</text><text x="344.8" y="185.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">sesiones que acerca</text><text x="344.8" y="198.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la fabricación digital y</text><text x="344.8" y="211.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la electrónica básica</text><text x="344.8" y="225" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">a la sala de colegios</text><text x="344.8" y="238.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">municipales, sin</text><text x="344.8" y="251.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">necesidad de un Fab</text><text x="344.8" y="264.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Lab.</text></g><g id="bloque-1-4"><text x="487.2" y="131.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Relación y canales</text><circle cx="489.2" cy="153.8" r="1.3" fill="#1E1E1E"/><text x="499.2" y="157.2" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Relación:</text><text x="499.2" y="170.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">acompañamiento</text><text x="499.2" y="183.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">directo,</text><text x="499.2" y="196.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">retroalimentación y</text><text x="499.2" y="210" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">recursos que</text><text x="499.2" y="223.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">quedan en la sala.</text><circle cx="489.2" cy="240" r="1.3" fill="#1E1E1E"/><text x="499.2" y="243.4" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Canales:</text><text x="541.31" y="243.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">visitas a</text><text x="499.2" y="256.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">colegios, docentes</text><text x="499.2" y="269.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">y sostenedores,</text><text x="499.2" y="283" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">redes sociales y</text><text x="499.2" y="296.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">presentación de</text><text x="499.2" y="309.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">resultados.</text></g><g id="bloque-1-5"><text x="629.6" y="131.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Segmentos</text><circle cx="631.6" cy="153.8" r="1.3" fill="#1E1E1E"/><text x="641.6" y="157.2" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Directos:</text><text x="641.6" y="170.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">estudiantes de 5°</text><text x="641.6" y="183.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">básico municipal y</text><text x="641.6" y="196.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">sus docentes.</text><circle cx="631.6" cy="213.6" r="1.3" fill="#1E1E1E"/><text x="641.6" y="217" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Indirectos:</text><text x="693.57" y="217" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">colegios</text><text x="641.6" y="230.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">municipales,</text><text x="641.6" y="243.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">sostenedores</text><text x="641.6" y="256.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">(municipios y SLEP)</text><text x="641.6" y="269.8" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">y familias.</text></g><g id="bloque-2-1"><text x="60" y="422.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Estructura de costos</text><text x="60" y="448.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Materiales de fabricación (PLA, MDF, cartón), electrónica, placa PCB, láminas y</text><text x="60" y="461.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">tiempo de facilitación. $200.131 por curso, unos $6.065 por estudiante.</text></g><g id="bloque-2-2"><text x="487.2" y="422.2" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Fuentes de financiamiento</text><text x="487.2" y="448.2" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Subvención Escolar Preferencial (SEP), presupuesto</text><text x="487.2" y="461.4" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">de sostenedores municipales y SLEP, fondos</text><text x="487.2" y="474.6" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">concursables y venta del taller a colegios.</text></g></svg>
