<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="612" viewBox="0 0 1584 612"><g id="rejilla"><line x1="317.33" y1="187.4" x2="317.33" y2="335" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="554.67" y1="187.4" x2="554.67" y2="335" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="792" y1="187.4" x2="792" y2="335" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="1148" y1="187.4" x2="1148" y2="335" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="80" y1="341" x2="1504" y2="341" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="792" y1="347" x2="792" y2="424.6" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/></g><g id="bloque-1-1"><text x="100" y="213.4" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Socios clave</text><text x="100" y="239.4" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">Colegio Maipo, Mechatronic (proveedor de</text><text x="100" y="252" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">electrónica), Fab Labs y laboratorios</text><text x="100" y="264.6" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">universitarios, Universidad Diego Portales.</text></g><g id="bloque-1-2"><text x="337.33" y="213.4" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Actividades y recursos clave</text><circle cx="339.33" cy="236" r="1.3" fill="#1E1E1E"/><text x="349.33" y="239.4" font-family="NeutrifStudio-SemiBold" font-size="9.6" fill="#1E1E1E">Actividades:</text><text x="406.75" y="239.4" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">diseño del taller, modelado y</text><text x="349.33" y="252" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">fabricación digital, diseño de la placa</text><text x="349.33" y="264.6" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">PCB, facilitación, testeo e iteración.</text><circle cx="339.33" cy="280.8" r="1.3" fill="#1E1E1E"/><text x="349.33" y="284.2" font-family="NeutrifStudio-SemiBold" font-size="9.6" fill="#1E1E1E">Recursos:</text><text x="394.82" y="284.2" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">diseño y fabricación digital,</text><text x="349.33" y="296.8" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">software, impresora 3D, cortadora láser,</text><text x="349.33" y="309.4" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">kits con Arduino y la narrativa de Michi.</text></g><g id="bloque-1-3"><text x="574.67" y="213.4" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Propuesta de valor</text><text x="574.67" y="239.4" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">Taller maker de tres sesiones que acerca la</text><text x="574.67" y="252" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">fabricación digital y la electrónica básica a</text><text x="574.67" y="264.6" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">la sala de colegios municipales, sin</text><text x="574.67" y="277.2" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">necesidad de un Fab Lab.</text></g><g id="bloque-1-4"><text x="812" y="213.4" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Relación y canales</text><circle cx="814" cy="236" r="1.3" fill="#1E1E1E"/><text x="824" y="239.4" font-family="NeutrifStudio-SemiBold" font-size="9.6" fill="#1E1E1E">Relación:</text><text x="867.43" y="239.4" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">acompañamiento directo, retroalimentación y recursos que</text><text x="824" y="252" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">quedan en la sala.</text><circle cx="814" cy="268.2" r="1.3" fill="#1E1E1E"/><text x="824" y="271.6" font-family="NeutrifStudio-SemiBold" font-size="9.6" fill="#1E1E1E">Canales:</text><text x="864.43" y="271.6" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">visitas a colegios, docentes y sostenedores, redes sociales</text><text x="824" y="284.2" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">y presentación de resultados.</text></g><g id="bloque-1-5"><text x="1168" y="213.4" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Segmentos</text><circle cx="1170" cy="236" r="1.3" fill="#1E1E1E"/><text x="1180" y="239.4" font-family="NeutrifStudio-SemiBold" font-size="9.6" fill="#1E1E1E">Directos:</text><text x="1222.82" y="239.4" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">estudiantes de 5° básico municipal y sus docentes.</text><circle cx="1170" cy="255.6" r="1.3" fill="#1E1E1E"/><text x="1180" y="259" font-family="NeutrifStudio-SemiBold" font-size="9.6" fill="#1E1E1E">Indirectos:</text><text x="1229.89" y="259" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">colegios municipales, sostenedores (municipios y SLEP) y</text><text x="1180" y="271.6" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">familias.</text></g><g id="bloque-2-1"><text x="100" y="367" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Estructura de costos</text><text x="100" y="393" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">Materiales de fabricación (PLA, MDF, cartón), electrónica, placa PCB, láminas y tiempo de facilitación. $200.131 por curso, unos $6.065 por estudiante.</text></g><g id="bloque-2-2"><text x="812" y="367" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Fuentes de financiamiento</text><text x="812" y="393" font-family="NeutrifStudio-Regular" font-size="9.6" fill="#1E1E1E">Subvención Escolar Preferencial (SEP), presupuesto de sostenedores municipales y SLEP, fondos concursables y venta del taller a colegios.</text></g></svg>