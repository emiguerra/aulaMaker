 y="335.25" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">El curso y su profesora a</text><text x="476" y="348.25" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">cargo, en horario de clases.</text></g><g id="eslabon-4"><circle cx="648" cy="285.25" r="3.6" fill="#2E90CF"/><text x="644" y="263.25" font-family="NeutrifStudio-Regular" font-size="12" fill="#2E90CF">Carta</text><line x1="648" y1="292.25" x2="648" y2="319.25" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="644" y="335.25" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">La vinculación se formaliza</text><text x="644" y="348.25" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">con una carta de respaldo.</text></g></svg>