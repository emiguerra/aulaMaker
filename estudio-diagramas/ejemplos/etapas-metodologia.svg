pa 02</text><text x="222.67" y="243.97" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Búsqueda de</text><text x="222.67" y="258.47" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">establecimiento</text><path d="M287.67,440.7 L287.67,452.3 M292.69,443.6 L282.64,449.4 M292.69,449.4 L282.64,443.6" fill="none" stroke="#FF4040" stroke-width="2.9" stroke-linecap="round"/><text x="303.67" y="445.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Contacto con distintos</text><text x="303.67" y="457.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">colegios y gestión del</text><text x="303.67" y="469.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">espacio para testear el</text><text x="303.67" y="481.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">taller con el 5° A del</text><text x="303.67" y="493.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Colegio Maipo.</text></g><g id="etapa-3"><path d="M412.86,339.01 L491.81,316.99 Q504.33,313.5 515.4,320.31 L571.26,354.69 Q582.33,361.5 569.81,364.99 L490.86,387.01 Q478.33,390.5 467.26,383.69 L411.4,349.31 Q400.33,342.5 412.86,339.01 Z" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M479.33,320.47 L479.33,268.47 L423.33,232.47" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><text x="393.33" y="209.97" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Etapa 03</text><text x="393.33" y="224.47" font-family="NeutrifStudio-Regular" font-size="12" fill="#FF4040">Planificación del taller</text><path d="M458.33,406.7 L458.33,418.3 M463.36,409.6 L453.31,415.4 M463.36,415.4 L453.31,409.6" fill="none" stroke="#3A3A3A" stroke-width="2.9" stroke-linecap="round"/><text x="474.33" y="411.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Definición de las tres</text><text x="474.33" y="423.5" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E