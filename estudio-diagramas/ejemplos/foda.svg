<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="rejilla"><line x1="396" y1="138.7" x2="396" y2="310.1" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="60" y1="316.1" x2="732" y2="316.1" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><line x1="396" y1="322.1" x2="396" y2="473.3" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/></g><g id="bloque-1-1"><text x="80" y="164.7" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Fortalezas</text><circle cx="82" cy="187.3" r="1.3" fill="#1E1E1E"/><text x="92" y="190.7" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Bajo costo por estudiante:</text><text x="216.69" y="190.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">el taller completo cuesta $200.131</text><text x="92" y="203.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">para un curso de 33 estudiantes, unos $6.065 por estudiante.</text><circle cx="82" cy="220.7" r="1.3" fill="#1E1E1E"/><text x="92" y="224.1" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Deja recursos en la sala:</text><text x="205.37" y="224.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">las mejoras instaladas y los kits con</text><text x="92" y="237.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Arduino siguen sirviendo al docente después del taller.</text><circle cx="82" cy="254.1" r="1.3" fill="#1E1E1E"/><text x="92" y="257.5" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Metodología activa:</text><text x="186.45" y="257.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">los estudiantes proponen, votan, arman e</text><text x="92" y="270.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">instalan sus propias mejoras, aprendiendo desde el hacer, el</text><text x="92" y="283.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">error y la iteración.</text></g><g id="bloque-1-2"><text x="416" y="164.7" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Oportunidades</text><circle cx="418" cy="187.3" r="1.3" fill="#1E1E1E"/><text x="428" y="190.7" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Brecha de acceso a la fabricación digital:</text><text x="620.15" y="190.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">de los 26 Fab Labs</text><text x="428" y="203.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">de Chile, 13 están en la Región Metropolitana y varias</text><text x="428" y="217.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">regiones no tienen ninguno.</text><circle cx="418" cy="233.9" r="1.3" fill="#1E1E1E"/><text x="428" y="237.3" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Financiamiento posible:</text><text x="539.62" y="237.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la Subvención Escolar Preferencial</text><text x="428" y="250.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">(SEP) permite a los colegios invertir en material educativo.</text><circle cx="418" cy="267.3" r="1.3" fill="#1E1E1E"/><text x="428" y="270.7" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Escalabilidad:</text><text x="493.5" y="270.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">el taller puede replicarse en otros cursos y</text><text x="428" y="283.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">colegios, o ampliarse con nuevas sesiones y proyectos.</text></g><g id="bloque-2-1"><text x="80" y="342.1" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Debilidades</text><circle cx="82" cy="364.7" r="1.3" fill="#1E1E1E"/><text x="92" y="368.1" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Necesita un facilitador con conocimientos:</text><text x="292.66" y="368.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">la sesión de</text><text x="92" y="381.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Arduino requiere a alguien que domine electrónica básica</text><text x="92" y="394.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">para guiar a los grupos.</text><circle cx="82" cy="411.3" r="1.3" fill="#1E1E1E"/><text x="92" y="414.7" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Dependencia de la fabricación previa:</text><text x="268.68" y="414.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">entre sesiones se</text><text x="92" y="427.9" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">necesita acceso a impresora 3D y cortadora láser, que el</text><text x="92" y="441.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">colegio normalmente no tiene.</text></g><g id="bloque-2-2"><text x="416" y="342.1" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#FF639B">Amenazas</text><circle cx="418" cy="364.7" r="1.3" fill="#1E1E1E"/><text x="428" y="368.1" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Rigidez curricular y falta de tiempo:</text><text x="594.84" y="368.1" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">los colegios pueden no</text><text x="428" y="381.3" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">tener espacio en el horario para un taller de tres sesiones.</text><circle cx="418" cy="398.1" r="1.3" fill="#1E1E1E"/><text x="428" y="401.5" font-family="NeutrifStudio-SemiBold" font-size="10" fill="#1E1E1E">Bajo presupuesto escolar:</text><text x="549.77" y="401.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">muchos establecimientos priorizan</text><text x="428" y="414.7" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">gastos básicos antes que materiales nuevos.</text></g></svg>
