<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="contenido" transform="translate(0 119)"><g id="raiz"><text x="330.94" y="70" font-family="NeutrifStudio-MediumItalic" font-size="12" font-style="italic" fill="#2E90CF">Sistema escolar chileno</text><text x="153.66" y="92" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Tres niveles (parvularia, básica y media) y tres tipos de establecimiento, organizados así desde la dictadura</text><text x="337.54" y="105" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">(1973–1990). Bellei (2015)</text><line x1="396" y1="132" x2="396" y2="162" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g><g id="ramas"><line x1="169.33" y1="162" x2="622.67" y2="162" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="169.33" y1="162" x2="169.33" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="396" y1="162" x2="396" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><line x1="622.67" y1="162" x2="622.67" y2="190" fill="none" stroke="#1E1E1E" stroke-width="0.75"/></g><g id="hijo-1"><circle cx="169.33" cy="190" r="3" fill="#1E1E1E"/><text x="148.97" y="214" font-family="NeutrifStudio-Regular" font-size="12" fill="#2E90CF">Público</text><text x="100.52" y="234.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Administración traspasada del</text><text x="124.57" y="247.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Estado central a las</text><text x="131.19" y="260.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">municipalidades.</text><line x1="169.33" y1="275.5" x2="169.33" y2="295.5" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><path d="M115.37,301.5 L115.37,311.5 M119.7,304 L111.04,309 M119.7,309 L111.04,304" fill="none" stroke="#2E90CF" stroke-width="2.9" stroke-linecap="round"/><text x="126.37" y="310" font-family="NeutrifStudio-Regular" font-size="9.5" fill="#1E1E1E">Sala Maker trabaja aquí</text></g><g id="hijo-2"><circle cx="396" cy="190" r="3" fill="#1E1E1E"/><text x="326.72" y="214" font-family="NeutrifStudio-Regular" font-size="12" fill="#2E90CF">Particular subvencionado</text><text x="348.4" y="234.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Privados que reciben</text><text x="329.97" y="247.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">financiamiento estatal en las</text><text x="332.91" y="260.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">mismas condiciones que los</text><text x="375.48" y="273.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">públicos.</text></g><g id="hijo-3"><circle cx="622.67" cy="190" r="3" fill="#1E1E1E"/><text x="574.03" y="214" font-family="NeutrifStudio-Regular" font-size="12" fill="#2E90CF">Particular pagado</text><text x="553.2" y="234.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Financiado por las familias; los</text><text x="555.92" y="247.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">resultados siguen la jerarquía</text><text x="583.92" y="260.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">socioeconómica.</text><text x="549.67" y="273.5" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">García-Huidobro y Bellei (2003)</text></g></g></svg>
