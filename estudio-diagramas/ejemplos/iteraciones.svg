<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="612" viewBox="0 0 1584 612"><g id="contenido" transform="translate(0 6)"><g id="eje"><line x1="80" y1="312" x2="1504" y2="312" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M1504,312 L1498.52,314.45 L1498.52,309.55 Z" fill="#1E1E1E"/></g><g id="hito-1"><circle cx="246.4" cy="312" r="3.2" fill="#FF4040"/><path d="M246.4,306 L246.4,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="211.73" y="246" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Antes de S1</text><text x="162.19" y="262" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Reunión con Aarón: se revisa el taller</text><text x="174.03" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">y se ajustan las sesiones 1, 2 y 3</text></g><g id="hito-2"><circle cx="519.2" cy="312" r="3.2" fill="#FF4040"/><path d="M519.2,318 L519.2,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="506.41" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Idea</text><text x="438.41" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Diseñar una placa que reemplace la</text><text x="493.42" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">protoboard</text></g><g id="hito-3"><circle cx="822" cy="312" r="3.2" fill="#FF4040"/><path d="M822,306 L822,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="860.4" y="233" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Sesión 3</text><text x="804.88" y="249" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Se reemplaza la protoboard de 400</text><text x="804" y="262" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">puntos, que no tiene indicadores de</text><text x="842.75" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">positivo y negativo</text></g><g id="hito-4"><circle cx="1064.8" cy="312" r="3.2" fill="#FF4040"/><path d="M1064.8,318 L1064.8,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="1033.62" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Placa PCB</text><text x="985.64" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Todas las conexiones a tierra en un</text><text x="991.43" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">mismo lugar; fabricada en China</text></g><g id="hito-5"><circle cx="1337.6" cy="312" r="3.2" fill="#FF4040"/><path d="M1337.6,306 L1337.6,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="1307.25" y="259" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Pendiente</text><text x="1282.11" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Conversación con Karen</text></g></g></svg>