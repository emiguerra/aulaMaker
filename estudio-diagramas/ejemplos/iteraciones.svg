<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612"><g id="contenido" transform="translate(0 6)"><g id="eje"><line x1="40" y1="312" x2="752" y2="312" fill="none" stroke="#1E1E1E" stroke-width="0.75"/><path d="M752,312 L746.52,314.45 L746.52,309.55 Z" fill="#1E1E1E"/></g><g id="hito-1"><circle cx="135.2" cy="312" r="3.2" fill="#FF4040"/><path d="M135.2,306 L135.2,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="100.53" y="246" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Antes de S1</text><text x="50.99" y="262" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Reunión con Aarón: se revisa el taller</text><text x="62.83" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">y se ajustan las sesiones 1, 2 y 3</text></g><g id="hito-2"><circle cx="265.6" cy="312" r="3.2" fill="#FF4040"/><path d="M265.6,318 L265.6,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="252.81" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Idea</text><text x="184.81" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Diseñar una placa que reemplace la</text><text x="239.82" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">protoboard</text></g><g id="hito-3"><circle cx="396" cy="312" r="3.2" fill="#FF4040"/><path d="M396,306 L396,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="370.92" y="233" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Sesión 3</text><text x="315.4" y="249" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Se reemplaza la protoboard de 400</text><text x="314.52" y="262" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">puntos, que no tiene indicadores de</text><text x="353.27" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">positivo y negativo</text></g><g id="hito-4"><circle cx="526.4" cy="312" r="3.2" fill="#FF4040"/><path d="M526.4,318 L526.4,332" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="495.22" y="346" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Placa PCB</text><text x="447.24" y="362" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Todas las conexiones a tierra en un</text><text x="453.03" y="375" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">mismo lugar; fabricada en China</text></g><g id="hito-5"><circle cx="656.8" cy="312" r="3.2" fill="#FF4040"/><path d="M656.8,306 L656.8,282" fill="none" stroke="#1E1E1E" stroke-width="0.75" stroke-dasharray="3 2.5"/><text x="626.45" y="259" font-family="NeutrifStudio-Medium" font-size="13" fill="#FF4040">Pendiente</text><text x="601.31" y="275" font-family="NeutrifStudio-Regular" font-size="10" fill="#1E1E1E">Conversación con Karen</text></g></g></svg>
